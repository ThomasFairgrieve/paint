<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wall Painter AR</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Wall Painter AR","short_name":"Painter","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#2196F3","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3532/3532851.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#2196F3">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3532/3532851.png">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            z-index: 10; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 20px; color: white;
        }
        input[type="color"] { width: 60px; height: 60px; border: none; border-radius: 50%; cursor: pointer; background: none; }
        #status { font-size: 12px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="controls">
        <div id="status">Loading AI Models...</div>
        <input type="color" id="colorPicker" value="#3498db">
        <span>Tap color to pick paint</span>
    </div>
</div>

<!-- TensorFlow.js and DeepLab Model -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/deeplab"></script>

<script>
/** 1. SERVICE WORKER (PWA) TRICK **/
// If URL has ?sw, act as the service worker
if (location.search.includes('sw')) {
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
} else {
    // Normal browser execution: Register this file as SW
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(window.location.href + '?sw')
            .then(() => console.log("PWA Registered"))
            .catch(err => console.error("SW failed", err));
    }

    /** 2. CAMERA AND AI LOGIC **/
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const colorPicker = document.getElementById('colorPicker');
    
    let model;
    let paintColor = { r: 52, g: 152, b: 219 }; // Default blue

    // Update color on change
    colorPicker.addEventListener('input', (e) => {
        const hex = e.target.value;
        paintColor.r = parseInt(hex.slice(1, 3), 16);
        paintColor.g = parseInt(hex.slice(3, 5), 16);
        paintColor.b = parseInt(hex.slice(5, 7), 16);
    });

    async function setupApp() {
        try {
            // Load DeepLab model (ADE20K has 'wall' label)
            model = await deeplab.load({ base: 'pascal', quantizationBytes: 2 });
            status.innerText = "Model Ready. Accessing Camera...";

            // Setup Camera
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                status.innerText = "Analyzing Scene...";
                requestAnimationFrame(predict);
            };
        } catch (e) {
            status.innerText = "Error: " + e.message;
        }
    }

    async function predict() {
        if (!model) return;

        // Perform segmentation
        const prediction = await model.segment(video);
        
        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // DeepLab with Pascal/ADE20K: Wall is often index 0 or background.
        // We look for pixels identified as 'wall' or similar.
        // Note: For simplicity in this demo, we color areas based on labels.
        const { legend, segmentationMap } = prediction;
        
        // Create an overlay mask
        const imgData = ctx.createImageData(canvas.width, canvas.height);
        for (let i = 0; i < segmentationMap.length; i++) {
            const label = legend[Object.keys(legend)[0]]; // Simple label extraction
            
            // Logic: In DeepLab PASCAL, index for background/objects.
            // For a robust 'wall', we filter by the class name.
            // Here we check if the pixel belongs to a "static" background area.
            if (segmentationMap[i] === 0) { // 0 is often background/walls in Pascal
                const j = i * 4;
                imgData.data[j] = paintColor.r;
                imgData.data[j+1] = paintColor.g;
                imgData.data[j+2] = paintColor.b;
                imgData.data[j+3] = 150; // Opacity (0-255)
            }
        }
        
        ctx.putImageData(imgData, 0, 0);
        status.innerText = "Painting Mode Active";
        requestAnimationFrame(predict);
    }

    setupApp();
}
</script>
</body>
</html>
