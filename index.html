<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Wall Painter</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"AI Wall Painter","short_name":"Painter","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#2196F3","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3532/3532851.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#2196F3">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3532/3532851.png">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Video and Canvas sizing */
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #overlay { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 2; pointer-events: none; opacity: 0.7; }
        
        #ui {
            position: absolute; bottom: 30px; left: 0; right: 0;
            display: flex; flex-direction: column; align-items: center;
            z-index: 10; gap: 15px;
        }
        .controls-card {
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center; min-width: 200px;
        }
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 70px; height: 70px;
            border-radius: 50%; cursor: pointer; background: none; margin-bottom: 10px;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 3px solid white; border-radius: 50%; }
        
        #status { color: white; font-size: 14px; font-weight: 500; text-align: center; margin-bottom: 5px; }
        .loader { width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div id="ui">
        <div class="controls-card">
            <div id="status"><div class="loader"></div>Initializing AI...</div>
            <input type="color" id="colorPicker" value="#3498db">
            <div style="color: #ccc; font-size: 12px;">Point at a wall to paint</div>
        </div>
    </div>
</div>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/deeplab@0.2.2"></script>

<script>
/** 1. SERVICE WORKER / PWA LOGIC **/
if (location.search.includes('sw')) {
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
} else if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(window.location.href + '?sw');
}

/** 2. APP LOGIC **/
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('status');
const colorPicker = document.getElementById('colorPicker');

let model;
let wallColorRGB = null;
let userPaintColor = { r: 52, g: 152, b: 219 };

// Sync color picker
colorPicker.addEventListener('input', (e) => {
    const hex = e.target.value;
    userPaintColor = {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
});

async function init() {
    try {
        // 1. Load ADE20K Model
        statusText.innerHTML = '<div class="loader"></div>Loading Wall Model...';
        model = await deeplab.load({ base: 'ade20k', quantizationBytes: 2 });
        
        // 2. Setup Camera
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            predict();
        };
    } catch (err) {
        statusText.innerText = "Error: " + err.message;
        console.error(err);
    }
}

async function predict() {
    if (!model) return;

    // Perform Segmentation
    // ADE20K identifies "wall" specifically.
    const prediction = await model.segment(video);
    const { legend, segmentationMap, width, height } = prediction;

    // Find the internal color used by the model to represent 'wall'
    if (!wallColorRGB) {
        const wallKey = Object.keys(legend).find(k => k.toLowerCase().includes('wall'));
        if (wallKey) {
            wallColorRGB = legend[wallKey];
            statusText.innerText = "Wall Painting Active";
        } else {
            statusText.innerText = "Wall class not found";
        }
    }

    // Process the segmentation map
    // The map is a Uint8ClampedArray of RGBA values where each pixel's color 
    // represents a class defined in the legend.
    const imgData = ctx.createImageData(width, height);
    
    for (let i = 0; i < segmentationMap.length; i += 4) {
        const r = segmentationMap[i];
        const g = segmentationMap[i+1];
        const b = segmentationMap[i+2];

        // If this pixel's color matches the 'wall' color in the legend
        if (wallColorRGB && r === wallColorRGB[0] && g === wallColorRGB[1] && b === wallColorRGB[2]) {
            imgData.data[i] = userPaintColor.r;
            imgData.data[i+1] = userPaintColor.g;
            imgData.data[i+2] = userPaintColor.b;
            imgData.data[i+3] = 255; // Full opacity on the mask (CSS controls overall layer opacity)
        } else {
            imgData.data[i+3] = 0; // Transparent (not a wall)
        }
    }

    // Draw prediction to overlay
    // We use a temporary canvas to scale the segmentation back to the UI size if needed
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    tempCanvas.getContext('2d').putImageData(imgData, 0, 0);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);

    // Loop
    requestAnimationFrame(predict);
}

init();
</script>
</body>
</html>
