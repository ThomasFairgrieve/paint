<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap-to-Paint AR</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"TapPainter","short_name":"TapPaint","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#2196F3","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3532/3532851.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#2196F3">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #app { position: relative; width: 100vw; height: 100vh; touch-action: none; }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 2; pointer-events: none; }
        
        .ui-panel {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            padding: 20px; border-top-left-radius: 20px; border-top-right-radius: 20px;
            display: flex; flex-direction: column; gap: 15px; color: white;
        }
        
        .row { display: flex; align-items: center; gap: 15px; justify-content: space-between; }
        .slider-box { flex-grow: 1; }
        input[type="range"] { width: 100%; }
        
        input[type="color"] {
            -webkit-appearance: none; border: 2px solid white; width: 50px; height: 50px;
            border-radius: 10px; background: none; cursor: pointer;
        }
        
        button {
            background: #444; color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-weight: bold;
        }
        
        #hint {
            position: absolute; top: 20px; width: 100%; text-align: center;
            z-index: 5; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="hint">Tap a wall to paint it</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="paintCanvas"></canvas>
    
    <div class="ui-panel">
        <div class="row">
            <input type="color" id="colorPicker" value="#3498db">
            <div class="slider-box">
                <label>Tolerance</label>
                <input type="range" id="tolerance" min="1" max="150" value="40">
            </div>
            <button onclick="clearCanvas()">Clear</button>
        </div>
    </div>
</div>

<script>
/** 1. PWA SERVICE WORKER **/
if (location.search.includes('sw')) {
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
} else if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(window.location.href + '?sw');
}

/** 2. CAMERA SETUP **/
const video = document.getElementById('video');
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('colorPicker');
const toleranceInput = document.getElementById('tolerance');

// Hidden canvas to process frames
const procCanvas = document.createElement('canvas');
const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

async function initCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        procCanvas.width = video.videoWidth;
        procCanvas.height = video.videoHeight;
    };
}

/** 3. FLOOD FILL LOGIC **/
function getPixelPos(x, y, width) {
    return (y * width + x) * 4;
}

function getColorDist(r1, g1, b1, r2, g2, b2) {
    // Euclidean distance in RGB space
    return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}

function floodFill(startX, startY) {
    // 1. Snapshot the current video frame for analysis
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
    const pixels = imgData.data;
    
    // 2. Prepare the Paint Overlay
    const overlayData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const overlayPixels = overlayData.data;

    const width = procCanvas.width;
    const height = procCanvas.height;
    const tolerance = parseInt(toleranceInput.value);
    
    // 3. Get target color
    const startPos = getPixelPos(startX, startY, width);
    const startR = pixels[startPos];
    const startG = pixels[startPos+1];
    const startB = pixels[startPos+2];

    // 4. Get paint color
    const hex = colorPicker.value;
    const pR = parseInt(hex.slice(1, 3), 16);
    const pG = parseInt(hex.slice(3, 5), 16);
    const pB = parseInt(hex.slice(5, 7), 16);

    // 5. Algorithm (Queue-based Flood Fill)
    const queue = [[startX, startY]];
    const visited = new Uint8Array(width * height);
    
    while (queue.length > 0) {
        const [x, y] = queue.pop();
        const pos = getPixelPos(x, y, width);
        const idx = y * width + x;

        if (visited[idx]) continue;
        visited[idx] = 1;

        const dist = getColorDist(startR, startG, startB, pixels[pos], pixels[pos+1], pixels[pos+2]);

        if (dist < tolerance) {
            // Apply paint to overlay
            overlayPixels[pos] = pR;
            overlayPixels[pos+1] = pG;
            overlayPixels[pos+2] = pB;
            overlayPixels[pos+3] = 180; // Opacity (0-255)

            // Add neighbors
            if (x > 0) queue.push([x - 1, y]);
            if (x < width - 1) queue.push([x + 1, y]);
            if (y > 0) queue.push([x, y - 1]);
            if (y < height - 1) queue.push([x, y + 1]);
        }
    }

    ctx.putImageData(overlayData, 0, 0);
}

/** 4. INTERACTION **/
document.getElementById('app').addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;

    // Convert screen tap coordinates to canvas coordinates
    const rect = video.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = Math.floor((e.clientX - rect.left) * scaleX);
    const y = Math.floor((e.clientY - rect.top) * scaleY);

    floodFill(x, y);
});

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

initCamera();
</script>
</body>
</html>
